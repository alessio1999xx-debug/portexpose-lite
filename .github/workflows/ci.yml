name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.8", "3.12"]
        include:
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python test_portexpose_lite.py
      - name: Demo exits 1 on public findings
        run: |
          set +e
          python portexpose_lite.py --demo
          rc=$?
          set -e
          test "$rc" -eq 1
